[project]
name = "hist2st"
version = "0.1.0"
description = "Hist2ST: spatial transcriptomics prediction from histology"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Unknown" }
authors = [
  { name = "Hist2ST Authors" }
]
dependencies = [
  "anndata>=0.8",
  "matplotlib>=3.5",
  "numpy>=1.21",
  "opencv-python>=4.5",
  "pandas>=1.4",
  "pillow>=9.0",
  "pytorch-lightning>=1.4",
  "scanpy>=1.8",
  "scikit-learn>=1.1",
  "scipy>=1.8",
  "scprep>=1.2",
  "seaborn>=0.12",
  "torch>=1.10",
  "torchvision>=0.11",
  "tqdm>=4.64",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "ruff>=0.5",
  "black>=24.0",
]

[tool.ruff]
line-length = 100

[tool.black]
line-length = 100
