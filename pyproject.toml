[project]
name = "spatial-curriculum"
version = "0.1.0"
description = "Spatial curriculum learning pipeline (Phases 2-5)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Unknown" }
authors = [
  { name = "Spatial Curriculum Authors" }
]
dependencies = [
  "anndata>=0.8",
  "einops>=0.6",
  "numpy>=1.21",
  "scanpy>=1.9",
  "scikit-learn>=1.1",
  "scipy>=1.8",
  "torch>=1.10",
  "torch-geometric>=2.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "ruff>=0.5",
  "black>=24.0",
]

[tool.ruff]
line-length = 100

[tool.black]
line-length = 100
