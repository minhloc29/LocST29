dataset:

  name: her2st
  data_root: null
  fold: 2
  train_slide_index: 0
  test_slide_index: 0
  flatten: false

training:

  total_epochs: 300
  batch_size: 1
  num_workers: 0
  lr: 0.00001 
  seed: 40
  device: cuda
  max_grad_norm: 1.0

model:

  module: "src.models.cnn"
  class_name: "CNNBaseline"
  kwargs: {}


difficulty:

  k_neighbours: 6
  n_clusters: 4
  learn_threshold: 0.30
  hard_percentile: 0.80
  interface_pct: 0.15
  dbscan_eps: 50
  max_never_learned_frac: 0.20

curriculum:

  warmup_ratio: 0.1
  tau_start: 0.10
  tau_end: 1.00
  tau_warmup_epochs: 150
  stability_weight: 0.50
  min_mask_fraction: 0.10


graph:

  k_neighbors: 6
  graph_diffusion_steps: 1
  graph_expansion_hops: 1

checkpoint:

  init_checkpoint: "checkpoints/warmup_init.pt"
  resume: ""

pipeline:

  wrap_model: true
  output_dir: "./runs/run1"